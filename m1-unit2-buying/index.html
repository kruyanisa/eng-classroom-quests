<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ม.1 Unit2 Buying souvenir with AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root { --primary: #3498db; --primary-dark: #2980b9; }
    body { font-family: 'Sarabun', sans-serif; background-color: transparent; padding: 15px; display: flex; justify-content: center; }
    .app-container { 
    width: 100%; 
    max-width: 500px; 
    /* ปรับพื้นหลังให้เป็นสีขาวกึ่งโปร่งใส */
    background: rgba(255, 255, 255, 0.7); 
    border-radius: 20px; 
    padding: 20px; 
    box-shadow: 0 8px 32px rgba(0,0,0,0.15); 
    /* เพิ่มความล้ำด้วยการเบลอพื้นหลัง */
    backdrop-filter: blur(10px); 
    -webkit-backdrop-filter: blur(10px);
    /* ลบเส้นกรอบเดิมออก */
    border: 1px solid rgba(255, 255, 255, 0.5); 
    text-align: center; 
}
    
    .items-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .item { background: #ebf5fb; padding: 8px; border-radius: 10px; border: 2px solid #d6eaf8; font-weight: bold; color: #2c3e50; font-size: 13px; transition: 0.2s;}
    .item.selected { border-color: #e74c3c; background-color: #fadbd8; box-shadow: 0 0 8px rgba(231,76,60,0.4); }
    
    .chat-box { background: #fdfefe; height: 250px; border: 2px solid #ecf0f1; border-radius: 10px; padding: 15px; overflow-y: auto; text-align: left; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;}
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 15px; line-height: 1.4;}
    .msg-ai { background: #d6eaf8; align-self: flex-start; border-bottom-left-radius: 0; color: #154360; font-weight: bold;}
    .msg-user { background: #d5f5e3; align-self: flex-end; border-bottom-right-radius: 0; color: #186a3b; }
    
    .btn-mic { background: #e74c3c; color: white; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 28px; cursor: pointer; box-shadow: 0 4px 0 #c0392b; transition: 0.2s; display: flex; align-items: center; justify-content: center; margin: 0 auto;}
    .btn-mic:active { transform: translateY(4px); box-shadow: none; }
    .btn-mic.listening { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; animation: pulse 1s infinite; }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    #status-text { color: #7f8c8d; font-size: 14px; margin-top: 15px; font-weight: bold;}

    #login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
    .modal-box { background: white; padding: 30px; border-radius: 15px; width: 85%; max-width: 350px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); text-align: center; }
    .modal-box input { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 16px; text-align: center; box-sizing: border-box; }
    .modal-box button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="app-container">
    <h2 style="color: var(--primary-dark); margin-top: 0;">🎙️ ม.1 Unit2 Buying souvenir with AI</h2>
    
    <div class="items-grid" id="items-grid"></div>
    
    <div class="chat-box" id="chat-box">
        <div style="text-align: center; color: #bdc3c7; font-size: 14px;">เริ่มการสนทนาโดยกดปุ่มไมค์</div>
    </div>
    
    <button class="btn-mic" id="mic-btn" onclick="toggleMic()">🎤</button>
    <p id="status-text">กดไมค์เพื่อเริ่มบทสนทนา</p>
</div>

<div id="login-modal">
    <div class="modal-box">
        <h2 style="margin-top: 0; color: var(--primary-dark);">คะแนนของคุณ: <span id="display-score"></span>/3</h2>
        <p style="font-size: 14px; color: #636e72; margin-bottom: 20px;">กรอกข้อมูลเพื่อส่งคะแนน</p>
        <input type="text" id="m_name" placeholder="ชื่อ - นามสกุล">
        <input type="text" id="m_room" placeholder="ชั้น/ห้อง (เช่น ม.1/1)">
        <input type="text" id="m_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
        <button id="submitBtnModal" onclick="submitToGoogleSheets()">🚀 ส่งคะแนน</button>
        <div id="modal-err" style="color:#d63031; font-size:14px; margin-top:10px; display:none;"></div>
        <div id="saveStatus" style="font-size: 16px; color: #27ae60; margin-top: 15px; font-weight: bold; display: none;"></div>
        <button onclick="document.getElementById('login-modal').style.display='none'" style="margin-top: 15px; background: transparent; border: none; color: #636e72; text-decoration: underline; cursor: pointer; font-size: 14px;">ปิดหน้าต่าง</button>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd_UGE1ZY_1dcB3B7l0Vy8azxhuuFoc_kftJ7QZ1Nc4XIaXGKF9RPs8WxhZ0K5VyVN/exec';
    const LESSON_NAME = 'ม.1 Unit2 Buying souvenir with AI';

    const chatBox = document.getElementById('chat-box');
    const micBtn = document.getElementById('mic-btn');
    const statusText = document.getElementById('status-text');
    const itemsGrid = document.getElementById('items-grid');
    
    let recognition;
    let isListening = false;
    let conversationActive = false;
    let conversationStep = 0;
    let currentScore = 0;
    let selectedItemKey = null;

    const itemDB = {
        'keyrings': { name: 'key rings', priceText: 'four', icon: '🔑' },
        'doll': { name: 'doll', priceText: 'six', icon: '💂‍♂️' },
        'flask': { name: 'thermos flask', priceText: 'thirteen', icon: '🍶' },
        'tshirt': { name: 'T-shirt', priceText: 'eight', icon: '👕' },
        'umbrella': { name: 'umbrella', priceText: 'twelve', icon: '🌂' },
        'bell': { name: 'bell', priceText: 'six', icon: '🔔' },
        'teddy': { name: 'teddy bear', priceText: 'four', icon: '🧸' },
        'scarf': { name: 'scarf', priceText: 'eight', icon: '🧣' }
    };
    const itemKeys = Object.keys(itemDB);

    function buildItemsGrid() {
        itemsGrid.innerHTML = '';
        itemKeys.forEach(key => {
            const item = itemDB[key];
            const itemDiv = document.createElement('div');
            itemDiv.classList.add('item');
            itemDiv.id = `item-${key}`;
            itemDiv.innerHTML = `${item.icon}<br>${item.name}`;
            itemsGrid.appendChild(itemDiv);
        });
    }
    buildItemsGrid();

    function highlightItem(key) {
        document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
        if (key && document.getElementById(`item-${key}`)) {
            document.getElementById(`item-${key}`).classList.add('selected');
        }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-GB';

        recognition.onstart = function() {
            isListening = true;
            micBtn.classList.add('listening');
            statusText.innerText = "กำลังฟัง... พูดได้เลยครับ";
            statusText.style.color = "#27ae60";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript.toLowerCase();
            addMessage(transcript, 'user');
            processInput(transcript);
        };

        recognition.onerror = function(event) {
            if (event.error === 'no-speech') {
                if(conversationActive && conversationStep === 1) {
                    let text = "How can I help you?";
                    addMessage(text, 'ai');
                    speakText(text);
                } else {
                    statusText.innerText = "ไม่ได้ยินเสียงครับ ลองกดอีกครั้ง";
                    statusText.style.color = "#e74c3c";
                }
            } else {
                statusText.innerText = "เกิดข้อผิดพลาด ลองกดอีกครั้ง";
                statusText.style.color = "#e74c3c";
            }
            stopMic();
        };

        recognition.onend = function() {
            stopMic();
        };
    } else {
        statusText.innerText = "เบราว์เซอร์ไม่รองรับ แนะนำให้เปิดใน Google Chrome ครับ";
        statusText.style.color = "#e74c3c";
        micBtn.style.display = "none";
    }

    function toggleMic() {
        if (!SpeechRecognition) return;
        
        if (isListening) {
            recognition.stop();
        } else {
            if (!conversationActive) {
                chatBox.innerHTML = ''; 
                currentScore = 0; 
                selectedItemKey = null;
                highlightItem(null);
                conversationActive = true;
                conversationStep = 1;
                addMessage("Good afternoon. How can I help you?", 'ai');
                speakText("Good afternoon. How can I help you?", () => { 
                    recognition.start(); 
                });
            } else {
                recognition.start();
            }
        }
    }

    function stopMic() {
        isListening = false;
        micBtn.classList.remove('listening');
        if(conversationActive) {
            statusText.innerText = "กดไมค์เพื่อตอบกลับ";
            statusText.style.color = "#7f8c8d";
        }
    }

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg', sender === 'ai' ? 'msg-ai' : 'msg-user');
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakText(text, callback) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-GB';
        utterance.rate = 0.9;
        
        utterance.onend = function() {
            if(callback) setTimeout(callback, 300);
        };
        window.speechSynthesis.speak(utterance);
    }

    function processInput(text) {
        setTimeout(() => {
            let aiReply = "";
            let itemFound = false;
            
            if (text.includes("key ring") || text.includes("keyring")) { selectedItemKey = 'keyrings'; itemFound = true; }
            else if (text.includes("doll")) { selectedItemKey = 'doll'; itemFound = true; }
            else if (text.includes("flask") || text.includes("bottle") || text.includes("water")) { selectedItemKey = 'flask'; itemFound = true; }
            else if (text.includes("t-shirt") || text.includes("shirt")) { selectedItemKey = 'tshirt'; itemFound = true; }
            else if (text.includes("umbrella")) { selectedItemKey = 'umbrella'; itemFound = true; }
            else if (text.includes("bell")) { selectedItemKey = 'bell'; itemFound = true; }
            else if (text.includes("teddy") || text.includes("bear")) { selectedItemKey = 'teddy'; itemFound = true; }
            else if (text.includes("scarf")) { selectedItemKey = 'scarf'; itemFound = true; }

            if (selectedItemKey) highlightItem(selectedItemKey);

            if (conversationStep === 1) {
                if (text.includes("buy") || text.includes("want") || text.includes("souvenir") || itemFound) {
                    if(currentScore === 0) currentScore = 1;
                    if (!selectedItemKey) {
                        let randomKey = itemKeys[Math.floor(Math.random() * itemKeys.length)];
                        selectedItemKey = randomKey;
                        highlightItem(selectedItemKey);
                        aiReply = `How about this ${itemDB[randomKey].name}?`;
                    } else {
                        aiReply = `Do you want to know the price of the ${itemDB[selectedItemKey].name}?`;
                    }
                    conversationStep = 2;
                } else {
                    aiReply = "Sorry, I didn't catch that. How can I help you?";
                }
            } 
            else if (conversationStep === 2) {
                if (text.includes("no") || text.includes("don't want")) {
                    let randomKey = itemKeys[Math.floor(Math.random() * itemKeys.length)];
                    selectedItemKey = randomKey;
                    highlightItem(selectedItemKey);
                    aiReply = `Okay, how about this ${itemDB[randomKey].name}?`;
                } 
                else if (text.includes("how much") || text.includes("price") || text.includes("cost")) {
                    if(currentScore < 2) currentScore = 2;
                    if (selectedItemKey) {
                        aiReply = `It is ${itemDB[selectedItemKey].priceText} pounds.`;
                        conversationStep = 3;
                    } else {
                        aiReply = "Which one? Please tell me what you want first.";
                    }
                } else if (itemFound) {
                    aiReply = `Do you want to know the price of the ${itemDB[selectedItemKey].name}?`;
                } else {
                    aiReply = "Sorry, I don't understand. Do you want to know the price?";
                }
            }
            else if (conversationStep === 3) {
                if (text.includes("here you are") || text.includes("here") || text.includes("take")) {
                    aiReply = "Thank you! Have a nice day.";
                    if(currentScore < 3) currentScore = 3;
                    conversationActive = false;
                } else {
                    aiReply = "Sorry, I didn't catch that. Please say 'Here you are' to give me the money.";
                }
            }

            addMessage(aiReply, 'ai');
            speakText(aiReply, () => {
                if (!conversationActive && currentScore > 0) {
                    showScoreModal();
                }
            });
        }, 800);
    }

    function showScoreModal() {
        document.getElementById('display-score').innerText = currentScore;
        setTimeout(() => {
            document.getElementById('submitBtnModal').style.display = 'inline-block';
            document.getElementById('saveStatus').style.display = 'none';
            document.getElementById('modal-err').style.display = 'none';

            if(localStorage.getItem('studentName')) {
                document.getElementById('m_name').value = localStorage.getItem('studentName');
                document.getElementById('m_room').value = localStorage.getItem('studentRoom');
                document.getElementById('m_id').value = localStorage.getItem('studentId');
            }
            document.getElementById('login-modal').style.display = 'flex';
        }, 1000);
    }

    async function submitToGoogleSheets() {
        let n = document.getElementById('m_name').value.trim();
        let r = document.getElementById('m_room').value.trim();
        let i = document.getElementById('m_id').value.trim();
        let err = document.getElementById('modal-err');
        let stat = document.getElementById('saveStatus');
        let btn = document.getElementById('submitBtnModal');

        if(!n || !r || i.length !== 5) {
            err.innerText = "กรุณากรอกข้อมูลให้ครบ และรหัสต้องมี 5 หลัก";
            err.style.display = 'block';
            return;
        }
        err.style.display = 'none';

        localStorage.setItem('studentName', n);
        localStorage.setItem('studentRoom', r);
        localStorage.setItem('studentId', i);

        btn.style.display = 'none';
        stat.style.display = 'block';
        stat.innerText = "⏳ กำลังบันทึกคะแนน...";

        const payload = { 
            name: n, room: r, studentId: i, 
            lesson: LESSON_NAME, score: currentScore, maxScore: 3, 
            _t: new Date().getTime() 
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            stat.innerText = '✅ บันทึกคะแนนเรียบร้อย!';
            setTimeout(() => { 
                document.getElementById('login-modal').style.display = 'none'; 
                statusText.innerText = "กดไมค์เพื่อเริ่มรอบใหม่";
            }, 2000);
        } catch(error) {
            stat.innerText = '❌ ส่งข้อมูลไม่สำเร็จ';
            btn.style.display = 'inline-block';
        }
    }
</script>

</body>
</html>
