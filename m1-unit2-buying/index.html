<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Practice - Buying Things (Smart AI v2)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root { --primary: #3498db; --primary-dark: #2980b9; }
    body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f7; padding: 20px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 600px; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 3px solid var(--primary); text-align: center; }
    
    .items-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .item { background: #ebf5fb; padding: 8px; border-radius: 8px; border: 1px solid #d6eaf8; font-weight: bold; color: #2c3e50; font-size: 13px;}
    .item.selected { border-color: #3498db; background-color: #d6eaf8; box-shadow: 0 0 5px rgba(52,152,219,0.5); }
    
    .chat-box { background: #fdfefe; height: 320px; border: 2px solid #ecf0f1; border-radius: 10px; padding: 15px; overflow-y: auto; text-align: left; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;}
    .msg { padding: 12px; border-radius: 12px; max-width: 80%; font-size: 16px; line-height: 1.4;}
    .msg-ai { background: #d6eaf8; align-self: flex-start; border-bottom-left-radius: 0; color: #154360; font-weight: bold;}
    .msg-user { background: #d5f5e3; align-self: flex-end; border-bottom-right-radius: 0; color: #186a3b; }
    
    .btn-mic { background: #e74c3c; color: white; border: none; width: 70px; height: 70px; border-radius: 50%; font-size: 30px; cursor: pointer; box-shadow: 0 4px 0 #c0392b; transition: 0.2s; display: flex; align-items: center; justify-content: center; margin: 0 auto;}
    .btn-mic:active { transform: translateY(4px); box-shadow: none; }
    .btn-mic.listening { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; animation: pulse 1s infinite; }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    #status-text { color: #7f8c8d; font-size: 15px; margin-top: 15px; font-weight: bold;}
</style>
</head>
<body>

<div class="app-container">
    <h2 style="color: var(--primary-dark); margin-top: 0;">🎙️ Speaking Practice (All Items)</h2>
    
    <div class="items-grid" id="items-grid">
        </div>
    
    <div class="chat-box" id="chat-box">
        <div style="text-align: center; color: #bdc3c7; font-size: 14px;">เริ่มการสนทนาโดยกดปุ่มไมค์</div>
    </div>
    
    <button class="btn-mic" id="mic-btn" onclick="toggleMic()">🎤</button>
    <p id="status-text">กดไมค์เพื่อเริ่มบทสนทนา</p>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const micBtn = document.getElementById('mic-btn');
    const statusText = document.getElementById('status-text');
    const itemsGrid = document.getElementById('items-grid');
    
    let recognition;
    let isListening = false;
    let selectedItemKey = null; // null เมื่อยังไม่ได้เลือก
    let conversationStep = 0; // 0: Start, 1: SA offers help, 2: Selling, 3: Closing

    // ฐานข้อมูลสินค้าทั้ง 8 อย่างตามรูปแนบ
    const itemDB = {
        'keyrings': { name: 'key rings', priceNum: 4, priceText: 'four', icon: '🔑' },
        'doll': { name: 'doll', priceNum: 6, priceText: 'six', icon: '💂‍♂️' },
        'flask': { name: 'thermos flask', priceNum: 13, priceText: 'thirteen', icon: '🍶' },
        'tshirt': { name: 'T-shirt', priceNum: 8, priceText: 'eight', icon: '👕' },
        'umbrella': { name: 'umbrella', priceNum: 12, priceText: 'twelve', icon: '🌂' },
        'bell': { name: 'bell', priceNum: 6, priceText: 'six', icon: '🔔' },
        'teddy': { name: 'teddy bear', priceNum: 4, priceText: 'four', icon: '🧸' },
        'scarf': { name: 'scarf', priceNum: 8, priceText: 'eight', icon: '🧣' }
    };
    const itemKeys = Object.keys(itemDB);

    // สร้าง Grid สินค้า
    function buildItemsGrid() {
        itemsGrid.innerHTML = '';
        itemKeys.forEach(key => {
            const item = itemDB[key];
            const itemDiv = document.createElement('div');
            itemDiv.classList.add('item');
            itemDiv.id = `item-${key}`;
            itemDiv.innerHTML = `${item.icon}<br>${item.name}<br>£${item.priceNum}`;
            itemsGrid.appendChild(itemDiv);
        });
    }
    buildItemsGrid();

    // ไฮไลท์สินค้าที่เลือก
    function highlightSelectedItem(key) {
        document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
        if (key) {
            document.getElementById(`item-${key}`).classList.add('selected');
        }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-GB';

        recognition.onstart = function() {
            isListening = true;
            micBtn.classList.add('listening');
            statusText.innerText = "กำลังฟัง... พูดได้เลยครับ";
            statusText.style.color = "#27ae60";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript.toLowerCase();
            addMessage(transcript, 'user');
            processInput(transcript);
        };

        recognition.onerror = function(event) {
            statusText.innerText = "ไม่ได้ยินเสียงครับ ลองกดไมค์พูดใหม่อีกครั้ง";
            statusText.style.color = "#e74c3c";
            stopMic();
        };

        recognition.onend = function() {
            stopMic();
        };
    } else {
        statusText.innerText = "เบราว์เซอร์ไม่รองรับ แนะนำให้เปิดใน Google Chrome ครับก๊อปปี้โค้ดด้านบนนี้ ไปวางทับในไฟล์ `index.html` บน GitHub ของคุณ แล้วกด **"Commit changes"** ได้เลยครับ คราวนี้พนักงานขาย AI จะฉลาดขึ้น มีสินค้าครบทั้ง 8 อย่าง และไม่ล็อกขั้นตอนจนดู "จะขายอย่างเดียว" เหมือนเดิมแล้วครับ
